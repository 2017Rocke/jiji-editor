name: Build Windows and macOS releases
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: Windows-x64
          - os: macos-15
            platform: macOS-arm64
          - os: macos-15-intel
            platform: macOS-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python -c "import os,pathlib; assert os.environ['RELEASE_TAG'] == 'v'+pathlib.Path('VERSION').read_text().strip(), 'VERSION must match the release tag'"
      - run: python -m pip install -r requirements-build.txt
      - name: Test PDF operations and local API
        run: python -m unittest discover -s tests -v
      - name: Build Windows portable package
        if: runner.os == 'Windows'
        run: python scripts/build_windows.py
      - name: Verify Windows EXE
        if: runner.os == 'Windows'
        run: python scripts/verify_packaged.py output/JijiEditor-Windows-x64/JijiEditor.exe
      - name: Verify Windows desktop launcher
        if: runner.os == 'Windows'
        run: python scripts/verify_windows_launcher.py output/JijiEditor-Windows-x64/JijiEditor.exe
      - name: Build Mac application
        if: runner.os == 'macOS'
        env:
          JIJI_PYTHON: python
        run: bash scripts/build_mac.sh
      - name: Verify bundled Mac PDF engine
        if: runner.os == 'macOS'
        run: python scripts/verify_packaged.py 'output/吉吉编辑软件.app/Contents/Resources/backend/jiji-engine'
      - name: Record SHA-256 checksum
        run: python scripts/checksums.py
      - uses: actions/upload-artifact@v4
        with:
          name: JijiEditor-${{ matrix.platform }}
          path: |
            output/JijiEditor-*.zip
            output/SHA256SUMS-*.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: Verification-${{ matrix.platform }}
          path: output/*verification.json
          if-no-files-found: error
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: JijiEditor-*
          path: release
          merge-multiple: true
      - name: Publish verified packages
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$RELEASE_TAG" release/* --verify-tag --title "吉吉编辑软件 $RELEASE_TAG" --notes-file docs/releases/latest.md
