name: Build Windows and macOS releases
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: Windows-x64
          - os: macos-15
            platform: macOS-arm64
          - os: macos-15-intel
            platform: macOS-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-dotnet@v4
        if: runner.os == 'Windows'
        with:
          dotnet-version: '8.0.x'
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python -c "import os,pathlib; assert os.environ['RELEASE_TAG'] == 'v'+pathlib.Path('VERSION').read_text().strip(), 'VERSION must match the release tag'"
      - run: python -m pip install -r requirements-build.txt
      - name: Test PDF operations and local API
        run: python -m unittest discover -s tests -v
      - name: Build Windows portable package
        if: runner.os == 'Windows'
        run: python scripts/build_windows.py
      - name: Extract the actual Windows ZIP into a path with spaces and Chinese characters
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $destination = Join-Path $env:RUNNER_TEMP '吉吉 安装包验证'
          Expand-Archive -LiteralPath "output/JijiEditor-$version-Windows-x64.zip" -DestinationPath $destination -Force
          $executable = Join-Path $destination 'JijiEditor-Windows-x64/JijiEditor.exe'
          if (-not (Test-Path -LiteralPath $executable)) { throw 'The Windows ZIP is missing its executable' }
          $engine = Join-Path $destination 'JijiEditor-Windows-x64/backend/jiji-engine.exe'
          if (-not (Test-Path -LiteralPath $engine)) { throw 'The Windows ZIP is missing its PDF engine' }
          "JIJI_PACKAGED_EXE=$executable" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "JIJI_PACKAGED_ENGINE=$engine" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Ensure Microsoft WebView2 Runtime is available
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Get-WebView2RuntimeVersion {
            $client = 'Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
            foreach ($key in @("HKLM:\SOFTWARE\WOW6432Node\$client", "HKLM:\SOFTWARE\$client", "HKCU:\Software\$client")) {
              $installed = Get-ItemProperty -LiteralPath $key -Name pv -ErrorAction SilentlyContinue
              if ($installed -and $installed.pv -match '^\d+\.\d+\.\d+\.\d+$' -and [version]$installed.pv -gt [version]'0.0.0.0') {
                return $installed.pv
              }
            }
          }
          $version = Get-WebView2RuntimeVersion
          if (-not $version) {
            $installer = Join-Path (Split-Path -Parent $env:JIJI_PACKAGED_EXE) 'WebView2Setup.exe'
            $signature = Get-AuthenticodeSignature -LiteralPath $installer
            if ($signature.Status -ne 'Valid' -or $null -eq $signature.SignerCertificate -or
                $signature.SignerCertificate.Subject -notmatch '(^|,\s*)CN=Microsoft Corporation(,|$)' -or
                $signature.SignerCertificate.Subject -notmatch '(^|,\s*)O=Microsoft Corporation(,|$)') {
              throw 'WebView2 installer must have a valid Microsoft signature before execution'
            }
            $setup = Start-Process -FilePath $installer -ArgumentList '/silent', '/install' -PassThru
            $null = $setup.Handle
            if (-not $setup.WaitForExit(180000)) {
              Stop-Process -Id $setup.Id -Force -ErrorAction SilentlyContinue
              throw 'WebView2 Runtime installation timed out'
            }
            if ($setup.ExitCode -notin @(0, 3010)) { throw "WebView2 Runtime setup failed: $($setup.ExitCode)" }
            $version = Get-WebView2RuntimeVersion
            if (-not $version) { throw 'WebView2 Runtime was not detected after setup' }
          }
          Write-Host "Microsoft WebView2 Runtime version: $version"
      - name: Verify packaged Windows PDF engine
        if: runner.os == 'Windows'
        run: python scripts/verify_packaged.py "$env:JIJI_PACKAGED_ENGINE"
      - name: Verify Windows native editor window
        if: runner.os == 'Windows'
        run: python scripts/verify_windows_native.py "$env:JIJI_PACKAGED_EXE"
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows' && always()
        with:
          name: Windows-native-verification
          path: output/native-*
          if-no-files-found: warn
      - uses: actions/setup-node@v4
        if: runner.os == 'Windows'
        with:
          node-version: '22'
      - name: Install the browser verifier
        if: runner.os == 'Windows'
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install chromium
      - name: Verify packaged Windows browser interactions
        if: runner.os == 'Windows'
        run: node scripts/verify_packaged_browser.cjs "$env:JIJI_PACKAGED_ENGINE"
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows' && always()
        with:
          name: Windows-browser-verification
          path: |
            output/packaged-browser-verification.json
            output/packaged-browser-verification.png
          if-no-files-found: warn
      - name: Build Mac application
        if: runner.os == 'macOS'
        env:
          JIJI_PYTHON: python
        run: bash scripts/build_mac.sh
      - name: Verify bundled Mac PDF engine
        if: runner.os == 'macOS'
        run: python scripts/verify_packaged.py 'output/吉吉编辑软件.app/Contents/Resources/backend/jiji-engine'
      - name: Record SHA-256 checksum
        run: python scripts/checksums.py
      - uses: actions/upload-artifact@v4
        with:
          name: JijiEditor-${{ matrix.platform }}
          path: |
            output/JijiEditor-*.zip
            output/SHA256SUMS-*.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: Verification-${{ matrix.platform }}
          path: output/*verification.json
          if-no-files-found: error
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: JijiEditor-*
          path: release
          merge-multiple: true
      - name: Publish verified packages
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$RELEASE_TAG" release/* --verify-tag --title "吉吉编辑软件 $RELEASE_TAG" --notes-file docs/releases/latest.md
